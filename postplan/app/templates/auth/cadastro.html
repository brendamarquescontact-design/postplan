{% extends "base.html" %}
{% from "_macros.html" import erro %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Criar conta</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" autocomplete="name" required maxlength="80" value="{{ form.get('nome', '') }}" {% if erros.nome %}aria-invalid="true" aria-describedby="erro-nome"{% endif %}>
    {{ erro(erros, 'nome') }}
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ form.get('email', '') }}" {% if erros.email %}aria-invalid="true" aria-describedby="erro-email"{% endif %}>
    {{ erro(erros, 'email') }}
    <label for="senha">Senha <small>(mínimo 8 caracteres)</small></label>
    <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="8" {% if erros.senha %}aria-invalid="true" aria-describedby="erro-senha"{% endif %}>
    {{ erro(erros, 'senha') }}
    <button class="btn btn-primario" type="submit">Criar conta</button>
  </form>
  <p class="sub">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
